name: Build personal recorder APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract App Name from HTML Title
        id: get_title
        run: |
          RAW_TITLE=$(grep -oP '(?<=<title>).*?(?=</title>)' index.html || echo "personal recorder")
          CLEAN_APP_NAME=$(echo "$RAW_TITLE" | sed 's/[^a-zA-Z0-9 ]//g' | xargs)
          CLEAN_FILE_NAME=$(echo "$CLEAN_APP_NAME" | sed 's/ /_/g')
          if [ -z "$CLEAN_APP_NAME" ]; then
            CLEAN_APP_NAME="personal_recorder"
            CLEAN_FILE_NAME="personal_recorder"
          fi
          echo "APP_NAME=$CLEAN_APP_NAME" >> $GITHUB_ENV
          echo "FILE_NAME=$CLEAN_FILE_NAME" >> $GITHUB_ENV

      - name: Structure and Configure Capacitor
        run: |
          mkdir -p www
          mv index.html style.css script.js www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/device @capacitor/filesystem @capacitor/share
          npm install @capacitor/app
          npm install @capawesome/capacitor-screenshot
          npm install @capacitor/assets --save-dev
          echo "{\"appId\": \"org.personalrecorder.app\", \"appName\": \"$APP_NAME\", \"webDir\": \"www\"}" > capacitor.config.json
          npx cap add android

      - name: Obfuscate JavaScript
        run: |
          npm install --no-save javascript-obfuscator
          npx javascript-obfuscator www/script.js --output www/script.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.4 \
            --self-defending true \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75

      - name: Generate App Icons
        run: |
          if [ -f "resources/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "No custom icon found at resources/icon.png, using default Capacitor icon."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Full Package Isolation
        run: |
          # 1. Update applicationId in build.gradle
          sed -i 's/applicationId ".*"/applicationId "org.personalrecorder.app"/' android/app/build.gradle
          
          # 2. Update package attributes in manifests
          sed -i 's/package=".*"/package="org.personalrecorder.app"/' android/app/src/main/AndroidManifest.xml
          
          # 3. Update FileProvider authorities to match the new package
          find android/app/src/main/ -type f -name "AndroidManifest.xml" \
            -exec sed -i -E 's/android:authorities="[^"]*\.fileprovider"/android:authorities="org.personalrecorder.app.fileprovider"/g' {} +
          
          # 4. Update the package declaration inside the Java file
          find android/app/src/main/ -type f -name "MainActivity.java" \
            -exec sed -i 's/^package .*;/package org.personalrecorder.app;/' {} +
          
          # 5. Create new directory path and move MainActivity.java to fit org.personalrecorder.app
          mkdir -p android/app/src/main/java/org/personalrecorder/app
          find android/app/src/main/java -name "MainActivity.java" \
            ! -path "*/org/personalrecorder/app/*" \
            -exec cp {} android/app/src/main/java/org/personalrecorder/app/MainActivity.java \;

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk ./"$FILE_NAME".apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.FILE_NAME }}-apk"
          path: "./${{ env.FILE_NAME }}.apk"
